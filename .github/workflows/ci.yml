name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # Lint the whole product, not just the library: the runner, the download
      # and analysis scripts, the config, and the validation programs that
      # produce the reported numbers.
      - name: Lint (ruff)
        run: >-
          uv run ruff check src/ tests/ config/ scripts/ validation/
          run_dcgo_human.py extract_human_interpro.py

      - name: Format check (ruff)
        run: uv run ruff format --check

      # The incremental strict-typing fence lives in pyproject.toml so this
      # exact command is reproducible locally.
      - name: Type check (strict, incremental)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Smoke-test installed wheel CLI
        run: |
          uv venv --python 3.12 /tmp/dcgo-wheel-smoke
          uv pip install --python /tmp/dcgo-wheel-smoke/bin/python dist/*.whl
          /tmp/dcgo-wheel-smoke/bin/dcgo --help

      - name: Smoke-test installed sdist CLI
        run: |
          uv venv --python 3.12 /tmp/dcgo-sdist-smoke
          uv pip install --python /tmp/dcgo-sdist-smoke/bin/python dist/*.tar.gz
          /tmp/dcgo-sdist-smoke/bin/dcgo --help
